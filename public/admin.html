<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - Booking Management</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        background-color: #f4f7f6;
        font-family: "Montserrat", sans-serif;
      }
      .admin-container {
        padding: 40px;
        max-width: 1100px;
        margin: 50px auto;
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }
      .admin-title {
        text-align: center;
        margin-bottom: 40px;
        font-family: "Roboto", sans-serif;
      }
      .bookings-section {
        margin-bottom: 50px;
      }
      .bookings-section h2 {
        font-family: "Roboto", sans-serif;
        border-bottom: 2px solid #eee;
        padding-bottom: 10px;
        margin-bottom: 20px;
      }
      .bookings-table {
        width: 100%;
        border-collapse: collapse;
      }
      .bookings-table th,
      .bookings-table td {
        padding: 15px;
        border-bottom: 1px solid #e0e0e0;
        text-align: left;
        vertical-align: middle;
      }
      .bookings-table th {
        background-color: #f8f9fa;
        font-weight: 700;
      }
      .bookings-table tr:last-child td {
        border-bottom: none;
      }
      .no-bookings-message {
        text-align: center;
        color: #7f8c8d;
        padding: 30px;
      }
      .actions-cell {
        text-align: right;
      }
      .btn-action {
        font-size: 0.8rem;
        padding: 8px 12px;
        margin-left: 8px;
        cursor: pointer;
        border: none;
        border-radius: 5px;
        color: white;
        transition: opacity 0.3s ease;
      }
      .btn-action:hover {
        opacity: 0.8;
      }
      .btn-cancel {
        background-color: #f39c12;
      }
      .btn-delete {
        background-color: #e74c3c;
      }
      .status-cancelled {
        color: #e74c3c;
        font-style: italic;
      }
      .admin-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 40px;
      }

      .admin-header h1 {
        margin: 0;
      }

      .btn-tax-settings {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
      }

      .btn-tax-settings:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
      }

      @media (max-width: 768px) {
        .admin-header {
          flex-direction: column;
          gap: 15px;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="admin-container">
      <div class="admin-header">
        <h1 class="admin-title">📅 Booking Management</h1>
        <a href="tax-settings.html" class="btn-tax-settings">
          <i class="fas fa-cog"></i> Configure Tax Rates
        </a>
      </div>

      <div class="bookings-section">
        <h2>Active Bookings</h2>
        <table class="bookings-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Check-In</th>
              <th>Check-Out</th>
              <th class="actions-cell">Actions</th>
            </tr>
          </thead>
          <tbody id="active-bookings-tbody"></tbody>
        </table>
        <p
          id="no-active-bookings"
          class="no-bookings-message"
          style="display: none"
        >
          No active bookings.
        </p>
      </div>

      <div class="bookings-section">
        <h2>Past & Cancelled Bookings</h2>
        <table class="bookings-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Check-In</th>
              <th>Check-Out</th>
              <th>Status</th>
              <th class="actions-cell">Actions</th>
            </tr>
          </thead>
          <tbody id="past-bookings-tbody"></tbody>
        </table>
        <p
          id="no-past-bookings"
          class="no-bookings-message"
          style="display: none"
        >
          No completed or cancelled bookings.
        </p>
      </div>
    </div>

    <script>
      // El frontend (Netlify) y el backend viven en dominios distintos.
      // TODO: reemplazar por la URL real una vez desplegado el backend (Render/Railway/etc).
      const PROD_API_URL = "https://escapelakenorman-api.onrender.com";
      const API_URL = ["localhost", "127.0.0.1"].includes(
        window.location.hostname,
      )
        ? `http://${window.location.hostname}:3001`
        : PROD_API_URL;

      document.addEventListener("DOMContentLoaded", () => {
        // --- VERIFICACIÓN Y REFERENCIAS ---
        const token = localStorage.getItem("admin_token");
        if (!token) {
          window.location.href = "login.html";
          return;
        }

        const activeTbody = document.getElementById("active-bookings-tbody");
        const pastTbody = document.getElementById("past-bookings-tbody");
        const noActiveMsg = document.getElementById("no-active-bookings");
        const noPastMsg = document.getElementById("no-past-bookings");

        // --- WEBSOCKET ---
        const wsProtocol = window.location.protocol === "https:" ? "wss" : "ws";
        const wsUrl = `${wsProtocol}://${API_URL.replace(/^https?:\/\//, "")}`;
        let socket = null;

        function connectWebSocket() {
          try {
            socket = new WebSocket(wsUrl);

            socket.addEventListener("message", (event) => {
              const message = JSON.parse(event.data);
              if (message.type === "bookings_updated") {
                console.log(
                  "Update received from server. Refreshing bookings...",
                );
                fetchAndRenderBookings();
              }
            });

            socket.addEventListener("open", () => {
              console.log("WebSocket connection established.");
            });

            socket.addEventListener("close", () => {
              console.log(
                "WebSocket connection closed. Attempting to reconnect...",
              );
              setTimeout(connectWebSocket, 3000);
            });

            socket.addEventListener("error", (error) => {
              console.error("WebSocket error:", error);
            });
          } catch (error) {
            console.error("WebSocket connection error:", error);
            setTimeout(connectWebSocket, 3000);
          }
        }

        // --- FUNCIONES DE AYUDA ---
        async function fetchWithAuth(url, options = {}) {
          const headers = {
            ...options.headers,
            Authorization: `Bearer ${token}`,
            "Content-Type": "application/json",
          };
          const response = await fetch(url, { ...options, headers });
          if (response.status === 401 || response.status === 403) {
            localStorage.removeItem("admin_token");
            window.location.href = "login.html";
            throw new Error("Session expired or invalid.");
          }
          return response;
        }

        function createRow(booking) {
          const tr = document.createElement("tr");
          const statusClass = `status-${booking.bookingStatus}`;
          const checkOutDate = new Date(booking.checkOut);
          const isPastOrCancelled =
            booking.bookingStatus !== "confirmed" || checkOutDate < new Date();

          tr.innerHTML = `
                <td>${booking.id}</td>
                <td>${checkOutDate.toLocaleDateString("en-US")}</td>
                <td>${new Date(booking.checkOut).toLocaleDateString(
                  "en-US",
                )}</td>
                ${
                  isPastOrCancelled
                    ? `<td class="${statusClass}">${booking.bookingStatus}</td>`
                    : ""
                }
                <td class="actions-cell">
                    ${
                      booking.bookingStatus === "confirmed" &&
                      !isPastOrCancelled
                        ? `<button class="btn-action btn-cancel" data-id="${booking.id}">Cancel</button>`
                        : ""
                    }
                    <button class="btn-action btn-delete" data-id="${
                      booking.id
                    }">Delete</button>
                </td>
            `;
          return tr;
        }

        function renderBookings(bookings) {
          activeTbody.innerHTML = "";
          pastTbody.innerHTML = "";
          noActiveMsg.style.display =
            bookings.active.length === 0 ? "block" : "none";
          noPastMsg.style.display =
            bookings.completed.length === 0 && bookings.cancelled.length === 0
              ? "block"
              : "none";
          bookings.active.forEach((b) => activeTbody.appendChild(createRow(b)));
          bookings.completed.forEach((b) =>
            pastTbody.appendChild(createRow(b)),
          );
          bookings.cancelled.forEach((b) =>
            pastTbody.appendChild(createRow(b)),
          );
        }

        async function fetchAndRenderBookings() {
          try {
            const response = await fetchWithAuth(
              `${API_URL}/api/admin/bookings`,
            );
            const bookingsData = await response.json();
            renderBookings(bookingsData);
          } catch (error) {
            console.error("Failed to fetch bookings:", error);
          }
        }

        // --- LÓGICA DE CLICS EN BOTONES ---
        document
          .querySelector(".admin-container")
          .addEventListener("click", async (e) => {
            const target = e.target;
            const bookingId = target.dataset.id;
            if (!bookingId || !target.classList.contains("btn-action")) return;

            if (target.classList.contains("btn-cancel")) {
              if (
                confirm(
                  `Are you sure you want to cancel booking #${bookingId}?`,
                )
              ) {
                try {
                  await fetchWithAuth(
                    `${API_URL}/api/admin/bookings/${bookingId}/cancel`,
                    { method: "POST" },
                  );
                } catch (error) {
                  console.error("Error cancelling booking:", error);
                }
              }
            }

            if (target.classList.contains("btn-delete")) {
              if (
                confirm(
                  `ARE YOU SURE you want to PERMANENTLY DELETE booking #${bookingId}?`,
                )
              ) {
                try {
                  await fetchWithAuth(
                    `${API_URL}/api/admin/bookings/${bookingId}`,
                    {
                      method: "DELETE",
                    },
                  );
                } catch (error) {
                  console.error("Error deleting booking:", error);
                }
              }
            }
          });

        // --- INICIALIZAR ---
        fetchAndRenderBookings();
        connectWebSocket();
      });
    </script>
  </body>
</html>
