# Render Blueprint - Backend de Lakeside Serenity (escapelakenorman-api)
#
# Cómo usarlo con el cliente:
#   1. Sube este archivo al repo (raíz).
#   2. En Render: New > Blueprint > conecta el repo.
#   3. Render pedirá rellenar las variables marcadas con sync: false
#      (las secretas: contraseña de admin, claves de Stripe, etc.).
#   4. Deploy. La URL resultante es
#      https://escapelakenorman-api-l2da.onrender.com (ya configurada en el frontend).
#
# IMPORTANTE (SQLite): este servicio debe usar RESERVATIONS_DB_PATH apuntando
# a /var/data/reservations.db para que el archivo viva en el disco persistente.
# Antes del cutover:
#   1. Inventariar y respaldar el archivo productivo actual (server/reservations.db)
#      fuera del servicio con fecha/hora y conteos de tablas críticas.
#   2. Adjuntar el disco persistente SIN montar sobre /opt/render/project/src.
#   3. Copiar el respaldo a /var/data/reservations.db antes de aceptar tráfico.
#   4. Verificar que bookings / booking_holds / manual_charges conserven conteos.
# Rollback:
#   - Conservar el respaldo previo al cutover.
#   - Restaurar ese respaldo en la ruta anterior o volver a copiarlo al disco
#     persistente antes del redeploy de reversión.

services:
  - type: web
    name: escapelakenorman-api
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: /health
    disk:
      name: escapelakenorman-data
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: RESERVATIONS_DB_PATH
        value: /var/data/reservations.db

      # Frontend (Netlify): de aquí salen success.html / cancel.html.
      # DOMAIN es la versión "canónica" del sitio (a donde Stripe redirige).
      - key: DOMAIN
        value: https://www.escapelakenorman.com
      # CORS: lista separada por comas con TODOS los orígenes válidos
      # (raíz y www, porque Netlify suele responder en ambos).
      - key: ALLOWED_ORIGINS
        value: https://escapelakenorman.com,https://www.escapelakenorman.com

      # Seguridad: el servidor NO arranca sin estas dos (process.exit)
      - key: ADMIN_PASSWORD
        sync: false # el cliente la escribe en el panel de Render
      - key: JWT_SECRET
        generateValue: true # Render genera un secreto aleatorio seguro

      # Stripe: el cliente las rellena cuando complete su cuenta.
      # Mientras estén vacías y MOCK_PAYMENTS=false, el endpoint de pago
      # devuelve 503 "Payments are not configured" (no rompe el sitio).
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # Pagos simulados: útil SOLO mientras el cliente verifica el flujo.
      # En cuanto pongan las claves reales de Stripe, ponerlo en false.
      # OJO: con NODE_ENV=production este modo se ignora siempre (blindado),
      # así que para la demo con pagos falsos usa NODE_ENV=development.
      - key: MOCK_PAYMENTS
        value: "false"

      # Calendario de Airbnb (iCal exportado desde el panel del anfitrión)
      - key: AIRBNB_ICAL_URL
        sync: false # la pega el cliente desde Airbnb > Calendario > Exportar

      # Tarifa de limpieza (USD). 0 = sin cleaning fee.
      - key: CLEANING_FEE
        value: "0"
